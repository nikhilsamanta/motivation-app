# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - motivation-app-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: motivationreg.azurecr.io/
          username: ${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DAF95EC80F6543199F97C5C20F6B636D }}
          password: ${{ secrets.AZUREAPPSERVICE_CONTAINERPASSWORD_0723E262BE10443797798696295EFEC8 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v3
        with:
          context: ./backend
          push: true
          tags: motivationreg.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DAF95EC80F6543199F97C5C20F6B636D }}/motivation-app:${{ github.sha }}
          file: ./backend/Dockerfile

  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    needs: build
    
    steps:
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B9CC96652456469FAEB52756E3947E50 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4A3D3D34FF4641278367C16367224D9A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F7B0EE0D0F84439EAB30ECD6CDCABAC6 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'motivation-app-backend'
          slot-name: 'Production'
          images: 'motivationreg.azurecr.io/${{ secrets.AZUREAPPSERVICE_CONTAINERUSERNAME_DAF95EC80F6543199F97C5C20F6B636D }}/motivation-app:${{ github.sha }}'
          